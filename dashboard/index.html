<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>invsqrt Research Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* One page, three files: live.json (every 15 s), history.json (machine metrics, every minute),
   researcher.json (every minute). Phone: one column. Wide or tall screens: a two-column grid. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #14202e; --muted: #5a6a7d; --line: #d9e0e8; --grid: #e8edf2;
  --accent: #0f7c86; --accent-soft: #d6eef0; --claude: #7a4fd1; --good: #1f8a4c; --warn: #b7791f; --bad: #c0392b;
  --good-soft: #e5f4ec; --warn-soft: #fbf1e0;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151d; --surface: #151f2a; --ink: #e6edf4; --muted: #93a3b5; --line: #263443; --grid: #1e2a36;
  --accent: #3cc0c9; --accent-soft: #123a3e; --claude: #a98bf0; --good: #4cc27f; --warn: #e2a64a; --bad: #ef6b5b;
  --good-soft: #13301f; --warn-soft: #33270f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e151d; --surface: #151f2a; --ink: #e6edf4; --muted: #93a3b5; --line: #263443; --grid: #1e2a36;
  --accent: #3cc0c9; --accent-soft: #123a3e; --claude: #a98bf0; --good: #4cc27f; --warn: #e2a64a; --bad: #ef6b5b;
  --good-soft: #13301f; --warn-soft: #33270f; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .full { grid-column: 1 / -1; }
  .col { gap: 14px; }
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
.stamp { font-family: var(--mono); font-size: .74rem; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero { font-family: var(--display); font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .hero { font-size: 3.2rem; } }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
p { margin: 6px 0 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: .7rem; letter-spacing: 0; text-transform: none; border: 0; background: none;
  color: var(--muted); padding: 3px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.verdict { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; margin-bottom: 8px;
  font-size: .85rem; background: var(--warn-soft); }
.verdict.ok { background: var(--good-soft); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.sub { font-size: .72rem; color: var(--muted); margin-top: 6px; }
.alerts div { padding: 3px 0; font-size: .88rem; }
.hw { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 900px) { .hw { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.hw .lbl { font-size: .74rem; color: var(--muted); }
.hw .val { font-weight: 600; font-size: .95rem; }
.hw .val small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.hw svg { height: 40px; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .72rem; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.quote { border-left: 3px solid var(--accent); padding: 2px 0 2px 9px; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 3.4rem 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: .84rem; }
.feed .t { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.feed .txt { min-width: 0; overflow-wrap: anywhere; }
ul.lessons { margin: 4px 0 0; padding-left: 18px; font-size: .84rem; }
.empty { color: var(--muted); font-size: .86rem; }
.res { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .res { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .res .wide { grid-column: 1 / -1; } }
.res h3 { margin: 0 0 4px; font-size: .74rem; font-weight: 600; color: var(--muted); }
.res .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.res .facts div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.res .facts b { display: block; font-size: 1rem; font-variant-numeric: tabular-nums; }
.res .facts small { color: var(--muted); font-size: .72rem; }
.tbl { overflow-x: auto; }
.tbl table { min-width: 560px; }
.qbox { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="full">
    <h1>invsqrt research loop</h1>
    <span class="stamp" id="stamp">loading</span>
  </header>
  <div class="banner full" id="banner" hidden>Example data.</div>

  <section class="card full" aria-labelledby="h-where">
    <h2 id="h-where">Where we are</h2>
    <div id="where"><p class="empty">Live updater not running.</p></div>
  </section>

  <section class="card full" aria-labelledby="h-prog">
    <h2 id="h-prog">Progress <span class="seg" data-range="progress">
      <button aria-pressed="false" data-v="24">24 h</button><button aria-pressed="true" data-v="168">7 d</button><button aria-pressed="false" data-v="0">all</button></span></h2>
    <div id="progress"></div>
  </section>

  <section class="card full" aria-labelledby="h-alerts">
    <h2 id="h-alerts">Alerts</h2>
    <div class="alerts" id="alerts"></div>
  </section>

  <section class="card full" aria-labelledby="h-hw">
    <h2 id="h-hw">Hardware and Claude <span class="seg" data-range="hw">
      <button aria-pressed="true" data-v="24">24 h</button><button aria-pressed="false" data-v="168">7 d</button></span></h2>
    <div class="hw" id="hw"></div>
    <div class="sub" id="hw-sub"></div>
  </section>

  <div class="col">
    <section class="card" aria-labelledby="h-isl">
      <h2 id="h-isl">Effort by island, last hour</h2>
      <div id="islands"></div>
    </section>
  </div>

  <div class="col">
    <section class="card" aria-labelledby="h-act">
      <h2 id="h-act">Recent activity</h2>
      <ul class="feed" id="activity"></ul>
    </section>
  </div>

  <section class="card full" aria-labelledby="h-res">
    <h2 id="h-res">Researcher <span class="stamp" id="res-stamp"></span></h2>
    <div class="res" id="researcher"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const short = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : fmt(n);
const dur = sec => sec == null || sec < 0 ? "–" : sec < 90 ? Math.round(sec) + " s" : sec < 5400 ? Math.round(sec / 60) + " min"
  : sec < 172800 ? (sec / 3600).toFixed(1).replace(/\.0$/, "") + " h" : (sec / 86400).toFixed(1).replace(/\.0$/, "") + " d";
const ago = t => t ? dur((Date.now() - Date.parse(t)) / 1000) + " ago" : "never";
const until = t => t ? dur((Date.parse(t) - Date.now()) / 1000) : "–";
const pctTxt = x => x == null ? "–" : Math.round(x) + "%";
const LIVE_STALE_S = 60;

const state = { live: null, hist: null, res: null, progressH: 168, hwH: 24 };

// ── charts ─────────────────────────────────────────────────────────────
// A line over [x0, x1]; null values break the line. opts: {lo, hi, color, ref: [{v, label}], step}
function line(points, x0, x1, opts) {
  const W = opts.w || 160, H = opts.h || 40, pad = 2;
  const vals = points.map(p => p[1]).filter(v => v != null);
  if (!vals.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="0" y="${H / 2 + 4}" font-size="10" fill="var(--muted)">no data yet</text></svg>`;
  const refs = (opts.ref || []).map(r => r.v);
  let lo = opts.lo ?? Math.min(...vals, ...refs), hi = opts.hi ?? Math.max(...vals, ...refs);
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = t => (t - x0) / ((x1 - x0) || 1) * W, Y = v => pad + (hi - v) / (hi - lo) * (H - 2 * pad);
  let d = "", prev = null;
  for (const [t, v] of points) {
    if (v == null) { prev = null; continue; }
    if (prev == null) d += `M${X(t).toFixed(1)},${Y(v).toFixed(1)}`;
    else d += (opts.step ? `H${X(t).toFixed(1)}V${Y(v).toFixed(1)}` : `L${X(t).toFixed(1)},${Y(v).toFixed(1)}`);
    prev = v;
  }
  const refLines = (opts.ref || []).map(r => `<line x1="0" x2="${W}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.color || "var(--warn)"}" stroke-dasharray="3 3"/>`
    + (r.label ? `<text x="4" y="${Y(r.v) - 4}" font-size="10" fill="var(--muted)">${esc(r.label)}</text>` : "")).join("");
  const axis = opts.axis ? [lo, (lo + hi) / 2, hi].map(v => `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>
    <text x="-4" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(opts.axis(v))}</text>`).join("") : "";
  const last = points.filter(p => p[1] != null).pop();
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">${axis}${refLines}
    <path d="${d}" fill="none" stroke="${opts.color || "var(--accent)"}" stroke-width="${opts.width || 2}" stroke-linejoin="round"/>
    ${opts.dot && last ? `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${opts.color || "var(--accent)"}"/>` : ""}</svg>`;
}

// ── blocks ─────────────────────────────────────────────────────────────
const VERDICT = { improving: ["Improving", "good"], slowing: ["Slowing", "warn"], plateau: ["Plateau", "bad"] };

function liveFresh() { return state.live && (Date.now() - Date.parse(state.live.generated_at)) / 1000 < LIVE_STALE_S; }

function where() {
  const L = state.live, R = state.res;
  if (!L) { $("where").innerHTML = `<p class="empty">Live updater not running.</p>`; return; }
  const sc = L.score, r = sc.best_cost ? sc.reference_cost / sc.best_cost : null;
  const v = VERDICT[L.progress && L.progress.verdict];
  const vsPub = r && sc.public_best_ratio ? r / sc.public_best_ratio - 1 : null;
  const dir = R && R.current_direction;
  const nextVisit = R && R.researcher && R.researcher.next_visit;
  $("where").innerHTML = `<div class="row" style="align-items:flex-end">
      <span class="hero">${r ? r.toFixed(1) + "×" : "–"}</span>
      <span class="pills">${liveFresh() ? `<span class="pill good">Running</span>` : `<span class="pill bad">Live data stale</span>`}
        ${v ? `<span class="pill ${v[1]}">${v[0]}${L.progress.since_hours != null ? ` · last gain ${dur(L.progress.since_hours * 3600)} ago` : ""}</span>` : ""}</span></div>
    <p>Best circuit costs <span class="num">${fmt(sc.best_cost)}</span> (Q ${sc.Q ?? "–"}, Toffolis ${fmt(sc.T)})${vsPub == null ? "" :
      `, ${vsPub >= 0 ? `${(vsPub * 100).toFixed(0)}% above` : `${(-vsPub * 100).toFixed(0)}% below`} the public best of ${sc.public_best_ratio}×`}.
      ${dir ? `Researcher: “${esc(dir.brief)}”` : "No researcher direction yet."}
      ${nextVisit ? ` Next visit in ${until(nextVisit)}.` : ""}</p>`;
}

function progressBlock() {
  const L = state.live;
  if (!L) { $("progress").innerHTML = `<p class="empty">Live updater not running.</p>`; return; }
  const sc = L.score, P = L.progress || {};
  const pts = (L.history || []).filter(p => p.cost).map(p => [Date.parse(p.t), sc.reference_cost / p.cost]);
  const v = VERDICT[P.verdict];
  const days = (P.per_day || []).map(d => d.count);
  const verdict = v ? `<div class="verdict ${P.verdict === "improving" ? "ok" : ""}"><span class="pill ${v[1]}">${v[0]}</span>
    <span>${P.last_gain ? `Last gain ${ago(P.last_gain)}.` : "No gain over the seed yet."} Gains per day, last 3 days: ${days.slice(-3).join(", ") || "–"}.</span></div>` : "";
  if (pts.length < 2) { $("progress").innerHTML = verdict + `<p class="empty">The chart appears after the first two measurements.</p>`; return; }
  const now = Date.now(), x1 = Math.max(now, pts[pts.length - 1][0]);
  const x0 = state.progressH ? x1 - state.progressH * 3600e3 : pts[0][0];
  const inRange = pts.filter(p => p[0] >= x0), before = pts.filter(p => p[0] < x0).pop();
  const series = (before ? [[x0, before[1]]] : []).concat(inRange).concat([[x1, (inRange.length ? inRange : [before])[(inRange.length || 1) - 1][1]]]);
  const W = Math.max(260, $("progress").clientWidth - 40), H = W > 700 ? 220 : 170;
  const chart = line(series, x0, x1, { w: W, h: H, step: true, dot: true, width: 2.4, label: "Best ratio over time",
    ref: sc.public_best_ratio ? [{ v: sc.public_best_ratio, label: `public ${sc.public_best_ratio}×`, color: "var(--muted)" }] : [],
    axis: v => v.toFixed(1) + "×" });
  const maxD = Math.max(1, ...days);
  const bars = days.map((c, i) => `<rect x="${i * (W / 7) + 4}" y="${34 - c / maxD * 30}" width="${W / 7 - 8}" height="${Math.max(1, c / maxD * 30)}"
    fill="${i >= 5 && c < days[Math.max(0, i - 1)] ? "var(--warn)" : "var(--accent)"}"><title>${c} on ${esc(P.per_day[i].day)}</title></rect>
    <text x="${i * (W / 7) + W / 14}" y="46" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(P.per_day[i].day.slice(5))}</text>`).join("");
  $("progress").innerHTML = verdict + `<div style="padding-left:40px">${chart}</div>
    <div class="sub">Improvements per day</div><div style="padding-left:40px"><svg viewBox="0 0 ${W} 48">${bars}</svg></div>`;
}

function alertsBlock() {
  const L = state.live;
  if (!L) { $("alerts").innerHTML = `<div class="bad">● Live updater not running</div>`; return; }
  const a = L.alerts || [];
  $("alerts").innerHTML = (liveFresh() ? "" : `<div class="bad">● Live data is ${ago(L.generated_at)} old</div>`) +
    (a.length ? a.map(x => `<div class="warn">● ${esc(x.text)}</div>`).join("") : `<div class="good">● All clear</div>`);
}

function hwBlock() {
  const L = state.live, H = state.hist, now = Date.now() / 1000;
  const x0 = now - state.hwH * 3600;
  const cur = (L && L.hardware && L.hardware.now) || {};
  const memTotal = (L && L.hardware && L.hardware.mem_total_gib) || (H && H.mem_total_gib);
  const ser = k => H ? H.t.map((t, i) => [t, H.series[k][i]]).filter(p => p[0] >= x0) : [];
  const claudePts = k => ((L && L.claude && L.claude.points) || []).map(p => [Date.parse(p.t) / 1000, p[k]]).filter(p => p[0] >= x0);
  const latest = (L && L.claude && L.claude.latest) || {};
  const tile = (label, value, chart) => `<div><div class="lbl">${label}</div><div class="val">${value}</div>${chart}</div>`;
  const opt = (o = {}) => ({ ...o });
  $("hw").innerHTML =
    tile("Devbox CPU", pctTxt(cur.cpu_pct), line(ser("cpu_pct"), x0, now, opt({ lo: 0, hi: 100, label: "Devbox CPU", ref: [{ v: 50 }] }))) +
    tile("Devbox memory", cur.mem_used_gib == null ? "–" : `${cur.mem_used_gib.toFixed(1)} <small>/ ${memTotal ? memTotal.toFixed(0) : "?"} GiB</small>`,
      line(ser("mem_used_gib"), x0, now, opt({ lo: 0, hi: memTotal || undefined, label: "Devbox memory" }))) +
    tile("Disk", pctTxt(cur.disk_pct), line(ser("disk_pct"), x0, now, opt({ lo: 0, hi: 100, label: "Disk", ref: [{ v: 85 }] }))) +
    tile("Qwen tokens/s", cur.qwen_tps == null ? "–" : fmt(cur.qwen_tps), line(ser("qwen_tps"), x0, now, opt({ lo: 0, label: "Qwen tokens per second", ref: [{ v: 70 }] }))) +
    tile("Qwen requests", cur.qwen_running == null ? "–" : `${fmt(cur.qwen_running)} <small>running · ${fmt(cur.qwen_waiting)} queued</small>`,
      line(ser("qwen_running"), x0, now, opt({ lo: 0, label: "Qwen requests running" }))) +
    tile("Qwen KV cache", pctTxt(cur.qwen_cache_pct), line(ser("qwen_cache_pct"), x0, now, opt({ lo: 0, hi: 100, label: "Qwen KV cache" }))) +
    tile("Claude 5 h window", `${pctTxt(latest.five_hour_pct)}${latest.five_hour_resets_at ? ` <small>resets in ${until(latest.five_hour_resets_at)}</small>` : ""}`,
      line(claudePts("five_hour_pct"), x0, now, opt({ lo: 0, hi: 100, color: "var(--claude)", label: "Claude 5 hour usage", ref: [{ v: 80 }] }))) +
    tile("Claude week", `${pctTxt(latest.seven_day_pct)}${latest.seven_day_resets_at ? ` <small>resets in ${until(latest.seven_day_resets_at)}</small>` : ""}`,
      line(claudePts("seven_day_pct"), x0, now, opt({ lo: 0, hi: 100, color: "var(--claude)", label: "Claude weekly usage", ref: [{ v: 80 }] })));
  const R = state.res && state.res.researcher;
  const proj = L && L.claude && L.claude.projected_week_pct;
  $("hw-sub").textContent = [
    L && L.hardware && L.hardware.qwen_down_since ? `Qwen unreachable since ${ago(L.hardware.qwen_down_since)}` : null,
    R ? `Claude: ${R.visits_24h ?? "–"} visits in 24 h` : null,
    proj != null ? `on pace for ${Math.round(proj)}% of the week by reset` : null,
    "dashed lines are alert thresholds"].filter(Boolean).join(" · ");
}

const CALL = { exploit: "good", boosted: "good", new: "", seed: "", retuned: "", throttled: "warn", restarted: "warn",
  migrated: "warn", retired: "bad" };
function islandsBlock() {
  const L = state.live;
  if (!L) { $("islands").innerHTML = `<p class="empty">Live updater not running.</p>`; return; }
  const calls = Object.fromEntries(((state.res && state.res.islands) || []).map(i => [i.id, i.call]));
  const rows = (L.islands || []).map(i => `<tr><td>${esc(i.island)} ${calls[i.island] ? `<span class="pill ${CALL[calls[i.island]] ?? ""}" style="font-size:.66rem">${esc(calls[i.island])}</span>` : ""}</td>
    <td class="n">${fmt(i.attempts_1h)}</td><td class="n">${i.pass_rate_1h == null ? "–" : Math.round(i.pass_rate_1h * 100) + "%"}</td>
    <td class="n">${short(i.best_cost)}</td></tr>`).join("");
  $("islands").innerHTML = rows ? `<table><thead><tr><th>Island</th><th class="n">Attempts</th><th class="n">Pass</th><th class="n">Best</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="empty">No islands yet.</p>`;
}

const OUTCOME = { met: "good", missed: "bad", open: "warn" };
function researcherBlock() {
  const R = state.res;
  $("res-stamp").textContent = R ? `view from ${ago(R.generated_at)}` : "";
  if (!R) { $("researcher").innerHTML = `<p class="empty">No researcher visit yet. The first visit sets a direction.</p>`; return; }
  const d = R.current_direction, ds = R.decision_summary || {}, q = R.questions || [], b = R.beliefs || {}, r = R.researcher || {};
  const list = (items, cls) => (items && items.length) ? `<ul class="lessons">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p class="empty">Nothing yet.</p>`;
  const facts = `<div class="facts wide">
      <div><small>Directions paid off</small><b>${ds.closed ? `${ds.paid_off} / ${ds.closed}` : "–"}</b></div>
      <div><small>Opus tokens per improvement</small><b>${short(ds.tokens_per_improvement)}</b></div>
      <div><small>Visits, 24 h</small><b>${r.visits_24h ?? "–"}</b></div>
      <div><small>Last visit</small><b>${esc(ago(r.last_visit))}</b></div>
      <div><small>Next visit</small><b>${r.next_visit ? "in " + esc(until(r.next_visit)) : "–"}</b></div>
    </div>`;
  const current = d ? `<div><h3>Current direction · ${esc(d.id)} · ${esc(ago(d.t))}</h3>
      <div class="quote" style="font-size:1rem">${esc(d.brief)}</div>
      <p style="font-size:.86rem"><span class="muted">Why:</span> ${esc(d.why)}</p>
      <p style="font-size:.86rem"><span class="muted">Expect:</span> ${esc(d.prediction)} <span class="num muted">(${esc(d.progress)})</span></p>
      ${d.explore_share != null ? `<p style="font-size:.86rem"><span class="muted">Effort split:</span> ${Math.round((1 - d.explore_share) * 100)}% on the best island, ${Math.round(d.explore_share * 100)}% exploring</p>` : ""}
    </div>` : `<div><h3>Current direction</h3><p class="empty">No direction yet.</p></div>`;
  const questions = `<div>${q.length ? `<div class="qbox"><h3 class="warn">Questions for you (${q.length})</h3>
      <ul class="lessons">${q.map(x => `<li>${esc(x.text)} <span class="stamp">${esc(ago(x.t))}</span></li>`).join("")}</ul></div>`
      : `<h3>Questions for you</h3><p class="empty">None open.</p>`}
      <h3 style="margin-top:10px">Islands</h3>
      ${(R.islands || []).length ? `<table><tbody>${R.islands.map(i => `<tr><td>${esc(i.id)}</td>
        <td><span class="pill ${CALL[i.call] ?? ""}" style="font-size:.66rem">${esc(i.call)}</span></td>
        <td class="muted" style="font-size:.8rem">${esc(i.idea)}</td>
        <td class="n ${i.trend_pct < 0 ? "good" : ""}">${i.trend_pct == null ? "–" : (i.trend_pct > 0 ? "+" : "") + i.trend_pct.toFixed(1) + "%"}</td></tr>`).join("")}</tbody></table>
        <p class="sub">Last column: change in island best cost over 24 h.</p>` : `<p class="empty">No islands yet.</p>`}
    </div>`;
  const log = `<div class="wide"><h3>Decision log</h3>${(R.decisions || []).length ? `<div class="tbl"><table>
      <thead><tr><th>#</th><th>When</th><th>Direction</th><th>Prediction</th><th>Outcome</th><th class="n">Opus tokens</th></tr></thead>
      <tbody>${R.decisions.slice(0, 10).map(x => `<tr><td class="num">${esc(x.id)}</td><td class="num" style="white-space:nowrap">${esc(ago(x.t))}</td>
        <td>${esc(x.brief)}</td><td class="muted" style="font-size:.8rem">${esc(x.prediction)}</td>
        <td><span class="pill ${OUTCOME[x.outcome] ?? ""}">${esc(x.outcome)}</span> <span class="muted" style="font-size:.78rem">${esc(x.detail)}</span></td>
        <td class="n">${short(x.tokens)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No decisions yet.</p>`}</div>`;
  const beliefs = `<div class="wide"><h3>What the researcher believes</h3><div class="res" style="gap:10px">
      <div><span class="good" style="font-size:.8rem;font-weight:600">Working</span>${list(b.working)}</div>
      <div><span class="bad" style="font-size:.8rem;font-weight:600">Not working</span>${list(b.not_working)}</div>
      <div class="wide"><span class="warn" style="font-size:.8rem;font-weight:600">Open questions</span>${list(b.open_questions)}</div></div></div>`;
  $("researcher").innerHTML = facts + current + questions + log + beliefs;
}

const KIND = { "new best": ["★", "good"], rejected: ["✗", "bad"], direction: ["◆", ""], lessons: ["◇", ""], committed: ["·", "muted"], measured: ["·", ""] };
function activityBlock() {
  const L = state.live;
  if (!L) { $("activity").innerHTML = `<li><span class="empty">Live updater not running.</span></li>`; return; }
  const rows = (L.activity || []).filter(a => a.kind !== "committed").slice(0, 10).map(a => {
    const [icon, cls] = KIND[a.kind] || ["·", ""];
    return `<li><span class="t">${esc(ago(a.t).replace(" ago", ""))}</span><span class="txt ${cls}">${icon} ${esc(a.kind)}: ${esc(a.text)}</span></li>`; }).join("");
  $("activity").innerHTML = rows || `<li><span class="empty">Nothing has happened yet.</span></li>`;
}

function render() {
  $("banner").hidden = ![state.live, state.res].some(x => x && x.example === true);
  where(); progressBlock(); alertsBlock(); hwBlock(); islandsBlock(); researcherBlock(); activityBlock();
  $("stamp").textContent = state.live ? `updated ${ago(state.live.generated_at)}` : "live: no data";
}

document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  state[seg.dataset.range === "progress" ? "progressH" : "hwH"] = Number(b.dataset.v);
  render();
}));

async function load(name, key) {
  try {
    const r = await fetch(name, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state[key] = await r.json();
  } catch (e) { state[key] = null; }
  render();
}
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });
load("live.json", "live"); load("history.json", "hist"); load("researcher.json", "res");
setInterval(() => load("live.json", "live"), 15000);
setInterval(() => load("history.json", "hist"), 60000);
setInterval(() => load("researcher.json", "res"), 60000);
setInterval(() => { $("stamp").textContent = state.live ? `updated ${ago(state.live.generated_at)}` : "live: no data"; }, 1000);
</script>
</body>
</html>
