<title>invsqrt Research Loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument panel — score strip, cost trace, health row, then the researcher's notebook below. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #14202e; --muted: #5a6a7d; --line: #d9e0e8;
  --accent: #0f7c86; --accent-soft: #d6eef0; --good: #1f8a4c; --warn: #b7791f; --bad: #c0392b;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e151d; --surface: #151f2a; --ink: #e6edf4; --muted: #93a3b5; --line: #263443;
  --accent: #3cc0c9; --accent-soft: #123a3e; --good: #4cc27f; --warn: #e2a64a; --bad: #ef6b5b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e151d; --surface: #151f2a; --ink: #e6edf4; --muted: #93a3b5; --line: #263443;
  --accent: #3cc0c9; --accent-soft: #123a3e; --good: #4cc27f; --warn: #e2a64a; --bad: #ef6b5b; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: .78rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.stamp { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: .9rem; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .label { font-size: .78rem; color: var(--muted); }
.kpi .value { font-family: var(--display); font-size: 1.75rem; font-weight: 600; }
.kpi .sub { font-size: .8rem; color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.chart-box { overflow-x: auto; }
svg.chart { width: 100%; min-width: 520px; height: auto; display: block; }
.row3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.meter { display: grid; grid-template-columns: 3.2rem 1fr 3rem; align-items: center; gap: 10px; font-size: .85rem; }
.track { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .88rem; margin: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; }
.direction blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 1rem; }
.direction p { margin: 0; font-size: .9rem; } .direction b { color: var(--muted); font-weight: 600; }
.table-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.pill { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.beliefs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.beliefs ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 4px; }
.beliefs h3 { margin: 0; font-size: .85rem; font-family: var(--display); }
.q { font-size: .92rem; margin: 0; }
.empty { color: var(--muted); font-size: .9rem; }
tr.stale td { opacity: .5; }
.pill.run { color: var(--accent); } .pill.idle { color: var(--muted); } .pill.stale { color: var(--warn); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-size: .88rem; }
.feed li { display: grid; grid-template-columns: 4.6rem 6.2rem 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.feed .t { font-family: var(--mono); font-size: .76rem; color: var(--muted); }
.feed .txt { min-width: 0; overflow-wrap: anywhere; }
.stamps { display: flex; flex-wrap: wrap; gap: 4px 16px; }
@media (max-width: 520px) { .feed li { grid-template-columns: 4rem 1fr; } .feed li .pill { grid-column: 2; justify-self: start; } .feed .txt { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } }
</style>

<div class="wrap">
  <header>
    <h1>invsqrt research loop</h1>
    <span class="stamps"><span class="stamp" id="stamp-live">live: loading</span>
      <span class="stamp" id="stamp-res">researcher: loading</span></span>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="kpis" id="kpis" aria-label="Where we stand"></section>

  <section class="panel" aria-labelledby="h-work">
    <h2 id="h-work">Lab assistants now</h2>
    <div class="table-box"><table id="workers"></table></div>
  </section>

  <section class="panel" aria-labelledby="h-act">
    <h2 id="h-act">Recent activity</h2>
    <ul class="feed" id="activity"></ul>
  </section>

  <section class="panel" aria-labelledby="h-trace">
    <h2 id="h-trace">Best cost over time</h2>
    <div class="chart-box" id="chart"></div>
  </section>

  <section class="row3" aria-label="Health">
    <div class="panel"><h2>Researcher budget</h2><div id="budget"></div></div>
    <div class="panel"><h2>Lab assistants</h2><dl class="facts" id="assistants"></dl></div>
    <div class="panel"><h2>Verifier</h2><dl class="facts" id="verifier"></dl></div>
  </section>

  <section class="panel direction" aria-labelledby="h-dir">
    <h2 id="h-dir">Current direction</h2>
    <div id="direction"></div>
  </section>

  <section class="panel" aria-labelledby="h-isl">
    <h2 id="h-isl">Islands</h2>
    <div class="table-box"><table id="islands"></table></div>
  </section>

  <section class="panel" aria-labelledby="h-log">
    <h2 id="h-log">Decision log</h2>
    <div class="table-box"><table id="decisions"></table></div>
    <p class="empty" id="decision-summary"></p>
  </section>

  <section class="panel" aria-labelledby="h-bel">
    <h2 id="h-bel">What the researcher believes</h2>
    <div class="beliefs" id="beliefs"></div>
  </section>

  <section class="panel" aria-labelledby="h-q">
    <h2 id="h-q">Questions for you</h2>
    <div id="questions"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const ratio = (ref, cost) => cost ? ref / cost : null;
const when = t => t ? new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
const pct = x => x == null ? "–" : (x * 100).toFixed(1) + "%";
const outcomeClass = { met: "good", missed: "bad", open: "warn" };
const callClass = { exploit: "good", "scale up": "good", restarted: "warn", stalled: "warn", retired: "bad", new: "", "long shot": "" };

function kpis(s) {
  if (!s) { $("kpis").innerHTML = `<p class="empty">Live updater not running. No score yet.</p>`; return; }
  const sc = s.score, r = ratio(sc.reference_cost, sc.best_cost);
  const vsPublic = r && sc.public_best_ratio ? (r / sc.public_best_ratio - 1) : null;
  const vsTop = r && sc.top_ratio ? (r / sc.top_ratio - 1) : null;
  const delta = r && sc.ratio_24h_ago ? r - sc.ratio_24h_ago : null;
  const tile = (label, value, sub, cls = "") =>
    `<div class="kpi"><span class="label">${label}</span><span class="value num ${cls}">${value}</span><span class="sub">${sub}</span></div>`;
  $("kpis").innerHTML =
    tile("Ratio vs reference", r ? r.toFixed(1) + "x" : "–",
         delta == null ? "no change data yet" : `${delta >= 0 ? "+" : ""}${delta.toFixed(1)} in 24 h`) +
    tile("Best cost", fmt(sc.best_cost), `Q ${sc.Q ?? "–"} · Toffolis ${fmt(sc.T)}`) +
    tile("vs public best", vsPublic == null ? "–" : `${vsPublic >= 0 ? "+" : ""}${(vsPublic * 100).toFixed(0)}%`,
         `public ${sc.public_best_ratio ?? "–"}x`, vsPublic == null ? "" : vsPublic >= 0 ? "good" : "bad") +
    tile("vs claimed top", vsTop == null ? "–" : `${vsTop >= 0 ? "+" : ""}${(vsTop * 100).toFixed(0)}%`,
         `top ~${sc.top_ratio ?? "–"}x`, vsTop == null ? "" : vsTop >= 0 ? "good" : "warn");
}

function chart(s) {
  if (!s) { $("chart").innerHTML = `<p class="empty">Live updater not running.</p>`; return; }
  const pts = (s.history || []).filter(p => p.cost);
  if (pts.length < 2) { $("chart").innerHTML = `<p class="empty">The trace appears after the first two measurements.</p>`; return; }
  const W = 960, H = 260, L = 70, R = 20, T = 18, B = 34;
  const xs = pts.map(p => Date.parse(p.t)), ys = pts.map(p => Math.log10(p.cost));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.15 || 0.05;
  const y0 = lo - pad, y1 = hi + pad;
  const X = t => L + (t - x0) / ((x1 - x0) || 1) * (W - L - R);
  const Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
  const area = `${line} L${X(x1).toFixed(1)},${H - B} L${X(x0).toFixed(1)},${H - B} Z`;
  const ticks = [0, 0.5, 1].map(f => y0 + pad + f * (y1 - y0 - 2 * pad));
  const grid = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmt(10 ** v)}</text>`).join("");
  const marks = (s.marks || []).filter(m => { const t = Date.parse(m.t); return t >= x0 && t <= x1; }).map(m => {
    const x = X(Date.parse(m.t));
    return `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--accent)" stroke-dasharray="3 4" opacity=".7"/>
      <text x="${x + 4}" y="${T + 10}" font-size="11" fill="var(--accent)" font-family="var(--mono)">${esc(m.label)}</text>`; }).join("");
  const last = pts.length - 1;
  $("chart").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Best cost over time, log scale">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
    ${marks}
    <circle cx="${X(xs[last])}" cy="${Y(ys[last])}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H - 10}" font-size="11" fill="var(--muted)">${esc(when(pts[0].t))}</text>
    <text x="${W - R}" y="${H - 10}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(when(pts[last].t))}</text>
  </svg>`;
}

function health(live, res) {
  const r = res && res.researcher;
  const meter = (label, val) => `<div class="meter"><span>${label}</span>
    <span class="track"><span class="fill" style="width:${Math.min(100, val ?? 0)}%"></span>${r.cap_pct != null ? `<span class="cap" style="left:${r.cap_pct}%"></span>` : ""}</span>
    <span class="num">${val == null ? "–" : Math.round(val) + "%"}</span></div>`;
  $("budget").innerHTML = r ? meter("5 h", r.five_hour_pct) + meter("7 d", r.seven_day_pct) +
    `<dl class="facts"><dt>Cap</dt><dd class="num">${r.cap_pct ?? "–"}%</dd><dt>Visits, 24 h</dt><dd class="num">${r.visits_24h ?? "–"}</dd>
     <dt>Last visit</dt><dd class="num">${esc(when(r.last_visit))}</dd>
     <dt>Next visit</dt><dd class="num">${esc(when(r.next_visit))}</dd></dl>`
    : `<p class="empty">No researcher visit yet.</p>`;
  const none = `<p class="empty">Live updater not running.</p>`;
  if (!live) { $("assistants").innerHTML = none; $("verifier").innerHTML = none; return; }
  const a = live.health.assistants, v = live.health.verifier, sp = live.health.spend;
  $("assistants").innerHTML = `<dt>Running</dt><dd class="num">${a.running ?? "–"}</dd>
    <dt>Attempts, 24 h</dt><dd class="num">${fmt(a.attempts_24h)}</dd>
    <dt>Hit rate</dt><dd class="num">${pct(a.hit_rate)}</dd>
    <dt>Fail the sweep</dt><dd class="num">${pct(a.sweep_fail_rate)}</dd>
    <dt>Qwen tokens out, 24 h</dt><dd class="num">${fmt(sp.qwen_tokens_out_24h)}</dd>`;
  $("verifier").innerHTML = `<dt>Waiting</dt><dd class="num">${v.backlog ?? "–"}</dd>
    <dt>Oldest wait</dt><dd class="num">${v.oldest_wait_min == null ? "–" : v.oldest_wait_min.toFixed(1) + " min"}</dd>
    <dt>Full checks, 24 h</dt><dd class="num">${v.full_checks_24h ?? "–"}</dd>
    <dt>CPU hours, 24 h</dt><dd class="num">${sp.cpu_seconds_24h == null ? "–" : (sp.cpu_seconds_24h / 3600).toFixed(1)}</dd>`;
}

const dur = sec => sec == null || sec < 0 ? "–" : sec < 90 ? Math.round(sec) + " s" : sec < 5400 ? Math.round(sec / 60) + " min" : (sec / 3600).toFixed(1) + " h";
const ago = t => t ? dur((Date.now() - Date.parse(t)) / 1000) + " ago" : "never";
const shortId = id => id ? String(id).replace(/^sha256:/, "").slice(0, 8) : "–";

function workers(live) {
  if (!live) { $("workers").innerHTML = `<tbody><tr><td class="empty">Live updater not running.</td></tr></tbody>`; return; }
  const rows = (live.workers || []).map(w => {
    const thinking = w.state === "thinking" && !w.stale;
    const pill = w.stale ? `<span class="pill stale">no heartbeat</span>`
      : `<span class="pill ${thinking ? "run" : "idle"}">${esc(w.state)}</span>`;
    const running = thinking && w.started_at ? dur((Date.now() - Date.parse(w.started_at)) / 1000) : "–";
    return `<tr class="${w.stale ? "stale" : ""}"><td class="num">${esc(w.worker)}</td><td>${pill}</td><td>${esc(w.island ?? "–")}</td>
      <td class="num">${esc(shortId(w.parent))}</td><td class="num">${running}</td><td class="num">${w.turns ?? "–"}</td>
      <td>${esc(w.last_tool ?? "–")}</td><td class="num">${fmt(w.tokens_out)}</td></tr>`; }).join("");
  $("workers").innerHTML = `<thead><tr><th class="num">Worker</th><th>State</th><th>Island</th><th class="num">Parent</th>
    <th class="num">Running for</th><th class="num">Turns</th><th>Last tool</th><th class="num">Tokens out</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="8" class="empty">No worker heartbeats yet.</td></tr>`}</tbody>`;
}

const kindClass = { "new best": "good", committed: "run", rejected: "bad", measured: "", direction: "warn", lessons: "warn" };
function activity(live) {
  if (!live) { $("activity").innerHTML = `<li><span class="empty">Live updater not running.</span></li>`; return; }
  const rows = (live.activity || []).map(a => `<li><span class="t">${esc(new Date(a.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }))}</span>
    <span><span class="pill ${kindClass[a.kind] ?? ""}">${esc(a.kind)}</span></span><span class="txt">${esc(a.text)}</span></li>`).join("");
  $("activity").innerHTML = rows || `<li><span class="empty">Nothing has happened yet.</span></li>`;
}

function direction(s) {
  const d = s && s.current_direction;
  if (!d) { $("direction").innerHTML = `<p class="empty">No researcher visit yet. The first visit sets a direction.</p>`; return; }
  $("direction").innerHTML = `<blockquote>${esc(d.brief)}</blockquote>
    <p><b>Why</b> ${esc(d.why)}</p>
    <p><b>Expect</b> ${esc(d.prediction)} <span class="num">(${esc(d.progress)})</span></p>
    <p class="stamp">${esc(d.id)} · ${esc(when(d.t))}${d.explore_share != null ? ` · exploring ${Math.round(d.explore_share * 100)}%` : ""}</p>`;
}

function islands(s) {
  const rows = ((s && s.islands) || []).map(i => `<tr><td class="num">${esc(i.id)}</td><td>${esc(i.idea)}</td>
    <td class="num">${i.assistants ?? "–"}</td><td class="num">${fmt(i.best_cost)}</td>
    <td class="num ${i.trend_pct < 0 ? "good" : ""}">${i.trend_pct == null ? "–" : (i.trend_pct > 0 ? "+" : "") + i.trend_pct.toFixed(1) + "%"}</td>
    <td><span class="pill ${callClass[i.call] ?? ""}">${esc(i.call)}</span></td></tr>`).join("");
  $("islands").innerHTML = `<thead><tr><th>Island</th><th>Idea</th><th class="num">Assistants</th><th class="num">Best cost</th>
    <th class="num">Trend 24 h</th><th>Researcher's call</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">No islands yet.</td></tr>`}</tbody>`;
}

function decisions(s) {
  const rows = ((s && s.decisions) || []).map(d => `<tr><td class="num">${esc(d.id)}</td><td class="num">${esc(when(d.t))}</td>
    <td>${esc(d.brief)}</td><td>${esc(d.prediction)}</td>
    <td><span class="pill ${outcomeClass[d.outcome] ?? ""}">${esc(d.outcome)}</span> ${esc(d.detail)}</td>
    <td class="num">${fmt(d.tokens)}</td></tr>`).join("");
  $("decisions").innerHTML = `<thead><tr><th>#</th><th>When</th><th>Direction</th><th>Prediction</th><th>Outcome</th><th class="num">Opus tokens</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="empty">No decisions yet.</td></tr>`}</tbody>`;
  const ds = s && s.decision_summary;
  $("decision-summary").textContent = ds && ds.closed
    ? `${ds.paid_off} of ${ds.closed} closed directions paid off · about ${fmt(ds.tokens_per_improvement)} Opus tokens per improvement`
    : "";
}

function beliefs(s) {
  const b = (s && s.beliefs) || {};
  const list = (title, items, cls) => `<div><h3 class="${cls}">${title}</h3>${(items && items.length)
    ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="empty">Nothing yet.</p>`}</div>`;
  $("beliefs").innerHTML = list("Working", b.working, "good") + list("Not working", b.not_working, "bad") + list("Open questions", b.open_questions, "warn");
}

function questions(s) {
  const q = (s && s.questions) || [];
  $("questions").innerHTML = q.length
    ? q.map(x => `<p class="q">${esc(x.text)} <span class="stamp">· ${esc(when(x.t))}</span></p>`).join("") +
      `<p class="empty">Answer through the admin chat.</p>`
    : `<p class="empty">No open questions.</p>`;
}

const state = { live: null, res: null, liveAt: null, resAt: null };

function stamps() {
  const mk = (label, at, gen, missing, staleSec) => {
    if (!at) return [missing, "warn"];
    const age = (Date.now() - Date.parse(gen)) / 1000;
    return [`${label} updated ${dur(age)} ago`, age > staleSec ? "warn" : ""];
  };
  const [lt, lc] = mk("live", state.live, state.live && state.live.generated_at, "live: no data", 60);
  const [rt, rc] = mk("researcher", state.res, state.res && state.res.generated_at, "researcher: none yet", 1e9);
  $("stamp-live").textContent = lt; $("stamp-live").className = "stamp " + lc;
  $("stamp-res").textContent = rt; $("stamp-res").className = "stamp " + rc;
}

function render() {
  const live = state.live, res = state.res;
  const banner = $("banner");
  const ex = [live, res].some(x => x && x.example === true);
  banner.hidden = !ex;
  banner.textContent = ex ? "Example data." : "";
  kpis(live); workers(live); activity(live); chart(live); health(live, res);
  direction(res); islands(res); decisions(res); beliefs(res); questions(res);
  stamps();
}

async function load(name, key, atKey) {
  try {
    const r = await fetch(name, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state[key] = await r.json();
    state[atKey] = state[key] ? Date.now() : null;
  } catch (e) { state[key] = null; }
  render();
}
const loadLive = () => load("live.json", "live", "liveAt");
